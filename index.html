<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WhatsUpDLSU Possible Tables</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="dashboard-header">
            <div class="container-fluid">
                <h1 class="dashboard-title">WhatsUpDLSU Charts</h1>
            </div>
        </header>
    
        <main class="container-fluid dashboard-main">
            <div class="row g-4">

                <div class="col-12 col-lg-4">
                    <div class="card chart-card h-100">
                        <div class="card-body">
                            <h2 class="chart-title">Event Status Breakdown</h2>
                            <p class="chart-description">
                                Share of events that are ongoing, upcoming, or finished.
                            </p>
                            <div class="chart-canvas-wrapper">
                                <canvas id="statusDoughnutChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-4">
                    <div class="card chart-card h-100">
                        <div class="card-body">
                            <h2 class="chart-title">Events per Organization</h2>
                            <p class="chart-description">
                                Number of events hosted by each college / org this term.
                            </p>
                            <div class="chart-canvas-wrapper">
                                <canvas id="orgBarChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-4">
                    <div class="card chart-card h-100">
                        <div class="card-body">
                            <h2 class="chart-title">Events Over Time</h2>
                            <p class="chart-description">
                                Monthly trend of total events logged in the system.
                            </p>
                            <div class="chart-canvas-wrapper">
                                <canvas id="timelineLineChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
        <script src="charts.js"></script>
    </body>
</html>
